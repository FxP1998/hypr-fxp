# : Manager [[[

[mgr]
cwd = { fg = "#e2e2e2" }

# Tab
tab_active = { fg = "#5f131c", bg = "#ffb3b4", bold = true }
tab_inactive = { fg = "#ffdad9", bg = "#40000a" }
tab_width = 1

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#ffb14a", bg = "#ffb14a" }
marker_cut      = { fg = "#ffddb0", bg = "#ffddb0" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#e5c18d", bg = "#e5c18d" }

# Count
count_copied   = { fg = "#281800", bg = "#ffddb0" }
count_cut      = { fg = "#281800", bg = "#ffddb0" }
count_selected = { fg = "#5f131c", bg = "#e5c18d" }

# Border
border_symbol = "│"
border_style  = { fg = "#ffb3b4" }

# : ]]]


# : Indicator [[[

[status]
separator_open = "🭁"
separator_close = "🭠"
separator_style = { bg = "#5f131c", fg = "#F4A261" }

[mode]
# Mode
normal_main = { bg = "#ffb3b4", fg = "#5f131c", bold = true }
normal_alt  = { bg = "#474747", fg = "#c6c6c6" }

# Select mode
select_main = { bg = "#e6bdbc", fg = "#44292a", bold = true }
select_alt  = { bg = "#474747", fg = "#c6c6c6" }

# Unset mode
unset_main = { bg = "#e5c18d", fg = "#422c05", bold = true }
unset_alt  = { bg = "#474747", fg = "#c6c6c6" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#ffb3b4", bg = "#393939" }
progress_error  = { fg = "#ffb4ab", bg = "#393939" }

# Permissions
permissions_type = { fg = "#bc4f4d" }
permissions_write = { fg = "#b17928" }
permissions_exec = { fg = "#ff2b12" }
permissions_read = { fg = "#ff9b17" }
permissions_sep = { fg = "#ff4540" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#ffb3b4" }
active = { fg = "#e5c18d", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "#ffb3b4" }
value  = { fg = "#e2e2e2" }

# : ]]]

# : Tabs [[[

[tabs]
active    = { fg = "#ffb3b4", bold = true, bg = "#131313" }
inactive  = { fg = "#e6bdbc", bg = "#131313" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#ffb3b4", bg = "#5f131c" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#ffb3b4" }
title   = {}
hovered = { fg = "#ffddb0", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#393939" }
cand = { fg = "#ffb3b4" }
rest = { fg = "#5f131c" }
desc = { fg = "#e2e2e2" }
separator = " ▶ "
separator_style = { fg = "#e2e2e2" }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#e2e2e2" }
run    = { fg = "#e2e2e2" }
footer = { fg = "#44292a", bg = "#e6bdbc" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#e5c18d" }
title_warn = { fg = "#ffb3b4" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#e2e2e2" },
    { url = "*/", fg = "#ffb3b4" },
]

# : ]]]
