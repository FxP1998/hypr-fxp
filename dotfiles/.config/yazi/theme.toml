# : Manager [[[

[mgr]
cwd = { fg = "#e2e2e2" }

# Tab
tab_active = { fg = "#3b1d71", bg = "#d2bbff", bold = true }
tab_inactive = { fg = "#eaddff", bg = "#25005a" }
tab_width = 1

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#ff7390", bg = "#ff7390" }
marker_cut      = { fg = "#ffd9e1", bg = "#ffd9e1" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#f0b7c5", bg = "#f0b7c5" }

# Count
count_copied   = { fg = "#31101b", bg = "#ffd9e1" }
count_cut      = { fg = "#31101b", bg = "#ffd9e1" }
count_selected = { fg = "#3b1d71", bg = "#f0b7c5" }

# Border
border_symbol = "│"
border_style  = { fg = "#d2bbff" }

# : ]]]


# : Indicator [[[

[status]
separator_open = "🭁"
separator_close = "🭠"
separator_style = { bg = "#3b1d71", fg = "#F4A261" }

[mode]
# Mode
normal_main = { bg = "#d2bbff", fg = "#3b1d71", bold = true }
normal_alt  = { bg = "#474747", fg = "#c6c6c6" }

# Select mode
select_main = { bg = "#cdc2db", fg = "#342d40", bold = true }
select_alt  = { bg = "#474747", fg = "#c6c6c6" }

# Unset mode
unset_main = { bg = "#f0b7c5", fg = "#4a2530", bold = true }
unset_alt  = { bg = "#474747", fg = "#c6c6c6" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#d2bbff", bg = "#393939" }
progress_error  = { fg = "#ffb4ab", bg = "#393939" }

# Permissions
permissions_type = { fg = "#7e62a2" }
permissions_write = { fg = "#d6385f" }
permissions_exec = { fg = "#ff2b12" }
permissions_read = { fg = "#ff4068" }
permissions_sep = { fg = "#8c44ff" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#d2bbff" }
active = { fg = "#f0b7c5", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "#d2bbff" }
value  = { fg = "#e2e2e2" }

# : ]]]

# : Tabs [[[

[tabs]
active    = { fg = "#d2bbff", bold = true, bg = "#131313" }
inactive  = { fg = "#cdc2db", bg = "#131313" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#d2bbff", bg = "#3b1d71" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#d2bbff" }
title   = {}
hovered = { fg = "#ffd9e1", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#393939" }
cand = { fg = "#d2bbff" }
rest = { fg = "#3b1d71" }
desc = { fg = "#e2e2e2" }
separator = " ▶ "
separator_style = { fg = "#e2e2e2" }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#e2e2e2" }
run    = { fg = "#e2e2e2" }
footer = { fg = "#342d40", bg = "#cdc2db" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#f0b7c5" }
title_warn = { fg = "#d2bbff" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#e2e2e2" },
    { url = "*/", fg = "#d2bbff" },
]

# : ]]]
