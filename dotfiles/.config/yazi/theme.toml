# : Manager [[[

[mgr]
cwd = { fg = "#e2e2e2" }

# Tab
tab_active = { fg = "#00391a", bg = "#80d997", bold = true }
tab_inactive = { fg = "#9cf6b2", bg = "#00210c" }
tab_width = 1

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#64cee8", bg = "#64cee8" }
marker_cut      = { fg = "#bdeaf5", bg = "#bdeaf5" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#a2ced9", bg = "#a2ced9" }

# Count
count_copied   = { fg = "#001f25", bg = "#bdeaf5" }
count_cut      = { fg = "#001f25", bg = "#bdeaf5" }
count_selected = { fg = "#00391a", bg = "#a2ced9" }

# Border
border_symbol = "│"
border_style  = { fg = "#80d997" }

# : ]]]


# : Indicator [[[

[status]
separator_open = "🭁"
separator_close = "🭠"
separator_style = { bg = "#00391a", fg = "#F4A261" }

[mode]
# Mode
normal_main = { bg = "#80d997", fg = "#00391a", bold = true }
normal_alt  = { bg = "#474747", fg = "#c6c6c6" }

# Select mode
select_main = { bg = "#b7ccb7", fg = "#223526", bold = true }
select_alt  = { bg = "#474747", fg = "#c6c6c6" }

# Unset mode
unset_main = { bg = "#a2ced9", fg = "#01363f", bold = true }
unset_alt  = { bg = "#474747", fg = "#c6c6c6" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#80d997", bg = "#393939" }
progress_error  = { fg = "#ffb4ab", bg = "#393939" }

# Permissions
permissions_type = { fg = "#618961" }
permissions_write = { fg = "#428da0" }
permissions_exec = { fg = "#ff2b12" }
permissions_read = { fg = "#38c0e1" }
permissions_sep = { fg = "#15e447" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#80d997" }
active = { fg = "#a2ced9", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "#80d997" }
value  = { fg = "#e2e2e2" }

# : ]]]

# : Tabs [[[

[tabs]
active    = { fg = "#80d997", bold = true, bg = "#131313" }
inactive  = { fg = "#b7ccb7", bg = "#131313" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#80d997", bg = "#00391a" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#80d997" }
title   = {}
hovered = { fg = "#bdeaf5", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#393939" }
cand = { fg = "#80d997" }
rest = { fg = "#00391a" }
desc = { fg = "#e2e2e2" }
separator = " ▶ "
separator_style = { fg = "#e2e2e2" }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#e2e2e2" }
run    = { fg = "#e2e2e2" }
footer = { fg = "#223526", bg = "#b7ccb7" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#a2ced9" }
title_warn = { fg = "#80d997" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#e2e2e2" },
    { url = "*/", fg = "#80d997" },
]

# : ]]]
