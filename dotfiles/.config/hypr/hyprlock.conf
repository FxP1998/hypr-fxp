# -----------------------------------------------------------------------------
#  󰣇  HYPRLAND CONFIGURATION
#  󰀻  File: hyprlock.conf
#  󰁔  Description: Screen locker configuration and styling.
#
#  󰄬  Created By: M. H. IMAM (FxP1998)
#  󰊤  GitHub: https://github.com/FxP1998/
# -----------------------------------------------------------------------------

source = ~/.config/hypr/modules/04-hypr-colors.conf

general {
    immediate_render = false
    no_faild_in = true
    no_faild_out = true
    hide_cursor = false
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/hypr/assets/current-wallpaper.png
    #path = screenshot
    color = $background
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# LEFT COLUMN: LOGIN & CLOCK

# Login Card Background
shape {
    monitor =
    size = 300, 250
    color = $surface_container
    rounding = 20
    border_size = 0
    position = -170, 150
    halign = center
    valign = center
    zindex = 0
}

# "Log in" Title
label {
    monitor =
    text = Log in
    color = $on_surface
    font_size = 30
    font_family = MapleMono NF Mono ExtraBold
    position = -170, 220
    halign = center
    valign = center
    zindex = 1
}

# Username Pill Background
shape {
    monitor =
    size = 260, 50
    color = $tertiary
    rounding = 10
    position = -170, 140
    halign = center
    valign = center
    zindex = 1
}

# Username Text
label {
    monitor =
    text =   $USER
    color = $on_tertiary
    font_size = 14
    font_family = MapleMono NF Mono
    position = -170, 140
    halign = center
    valign = center
    zindex = 2
}

# Password Input Field
input-field {
    monitor =
    size = 260, 50
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = $tertiary
    font_color = $on_tertiary
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = -170, 70
    halign = center
    valign = center
    zindex = 2
}

# Clock Card Background
shape {
    monitor =
    size = 300, 350
    color = $surface_container
    rounding = 20
    border_size = 0
    position = -170, -160
    halign = center
    valign = center
    zindex = 0
}

# Big Clock (Split format)
label {
    monitor =
    text = cmd[update:1000] date +"%I%n%M"
    color = $on_surface
    font_size = 70
    font_family = MapleMono NF Mono ExtraBold
    text_align = center
    position = -170, -135
    halign = center
    valign = center
    zindex = 1
}

# Uptime
label {
    monitor =
    text = cmd[update:60000] echo -e "UPTIME\n$(uptime -p | sed 's/up //')"
    color = $outline
    font_size = 12
    font_family = MapleMono NF Mono ExtraBold
    position = -170, -270
    halign = center
    valign = center
    zindex = 1
}

# RIGHT COLUMN: STATUS & USER

# Status Card Background
shape {
    monitor =
    size = 300, 350
    color = $surface_container
    rounding = 20
    border_size = 0
    position = 170, 100
    halign = center
    valign = center
    zindex = -1
}

# Song Info
label {
    monitor =
    text = cmd[update:999] ~/.config/hypr/assets/scripts/hyprlock/song-status.sh
    color = $on_surface
    font_size = 11
    font_family = MapleMono NF Mono Bold
    position = 170, 85
    halign = center
    valign = center
    zindex = 0
}

# Fallback Icon (Bottom Layer)
image {
    monitor =
    path = ~/.config/hypr/assets/icons/music-record.png
    size = 150
    rounding = 0
    border_size = 0
    position = 168, 180
    halign = center
    valign = center
    zindex = 0
}

# Album Art (Top Layer)
image {
    monitor =
    path = /tmp/album_art.png
    size = 150
    rounding = 10
    border_size = 2
    border_color = $on_surface
    reload_time = 1
    reload_cmd = ~/.config/hypr/assets/scripts/hyprlock/album_art.sh
    position = 170, 180
    halign = center
    valign = center
    zindex = 1
}

# Player Controls
label {
    monitor =
    text = 
    color = $on_surface
    font_size = 24
    font_family = MapleMono NF Mono
    position = 129, 50
    halign = center
    valign = center
    zindex = 0
    onclick = playerctl previous
}

label {
    monitor =
    text = cmd[update:999] ~/.config/hypr/assets/scripts/hyprlock/player-icon.sh
    color = $on_surface
    font_size = 22
    font_family = MapleMono NF Mono
    position = 170, 52
    halign = center
    valign = center
    zindex = 0
    onclick = playerctl play-pause
}

label {
    monitor =
    text = 
    color = $on_surface
    font_size = 24
    font_family = MapleMono NF Mono
    position = 209, 50
    halign = center
    valign = center
    zindex = 0
    onclick = playerctl next
}

# Battery Pill Background
shape {
    monitor =
    size = 259, 60
    color = $tertiary
    rounding = 14
    position = 169, -20
    halign = center
    valign = center
    zindex = 0
}

# Battery Text
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/assets/scripts/hyprlock/battery.sh
    color = $on_tertiary
    font_size = 15
    font_family = MapleMono NF Mono ExtraBold
    position = 169, -20
    halign = center
    valign = center
    zindex = 1
}

# User Card Background
shape {
    monitor =
    size = 298, 250
    color = $surface_container
    rounding = 19
    border_size = -1
    position = 169, -210
    halign = center
    valign = center
    zindex = -1
}

# User Avatar
image {
    monitor =
    path = ~/.config/hypr/assets/face.jpg
    size = 135
    rounding = -1
    border_size = 0
    position = 169, -170
    halign = center
    valign = center
    zindex = 1
}

# Date Info
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%a" | tr '[:lower:]' '[:upper:]')"
    color = $on_surface
    font_size = 30
    font_family = MapleMono NF Mono ExtraBold
    position = 170, -265
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%d %B, %Y")"
    color = $outline
    font_size = 12
    font_family = MapleMono NF Mono ExtraBold
    position = 170, -300
    halign = center
    valign = center
    zindex = 1
}
