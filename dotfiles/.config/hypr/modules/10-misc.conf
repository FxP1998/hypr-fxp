# == Layout: Dwindle ==
dwindle {
    pseudotile = true 
    preserve_split = true
    force_split = 2
    smart_resizing = true
    default_split_ratio = 0.9
}

# == Layout: Master ==
master {
    new_status = slave
    mfact = 0.50
    new_on_top = true
    new_on_active = after
}

# == Miscellaneous System Settings ==
misc {
    force_default_wallpaper = 0      # 0 or 1 to disable anime mascot wallpapers
    disable_hyprland_logo = true     # Disables the random Hyprland logo
    font_family = MapleMono NF
    vfr = true                       # Variable Frame Rate (Battery saver)
    vrr = 1                          # Variable Refresh Rate (1 = on)
    allow_session_lock_restore = true
    enable_anr_dialog = true         # App Not Responding dialog
}
