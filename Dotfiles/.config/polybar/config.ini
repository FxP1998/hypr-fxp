[colors]
; Read colors from Xresources (generated by Matugen)
background = ${xrdb:background}
foreground = ${xrdb:foreground}

; Using the ANSI mapping we created in the template
background-alt = ${xrdb:color0}
primary = ${xrdb:color2}
secondary = ${xrdb:color4}
alert = ${xrdb:color1}
disabled = ${xrdb:color8}

[bar/example]
width = 100%
height = 24pt
radius = 6

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

; Suggestion: Install a Nerd Font (like JetBrainsMono Nerd Font) for icons
font-0 = monospace;2

modules-left = xworkspaces xwindow
modules-right = filesystem pulseaudio xkeyboard memory cpu wlan eth date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; Enable BSPWM support so windows don't overlap the bar
wm-restack = bspwm

[module/systray]
type = internal/tray
format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /

; FIXED: Split into prefix (colored) and label (standard)
format-mounted = <label-mounted>
format-mounted-prefix = %mountpoint%
format-mounted-prefix-foreground = ${colors.primary}
label-mounted = " %percentage_used%%"

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5

; FIXED: Split into prefix and label for cleaner coloring
format-connected = <label-connected>
format-disconnected = <label-disconnected>

[module/wlan]
inherit = network-base
interface-type = wireless

; FIXED: Color the Interface Name (prefix) separately
format-connected-prefix = %ifname%
format-connected-prefix-foreground = ${colors.primary}
label-connected = " %essid% %local_ip%"

; FIXED: Color the Interface Name and the "disconnected" text separately
format-disconnected-prefix = %ifname%
format-disconnected-prefix-foreground = ${colors.primary}
label-disconnected = " disconnected"
label-disconnected-foreground = ${colors.disabled}

[module/eth]
inherit = network-base
interface-type = wired

; FIXED: Same fix for Ethernet
format-connected-prefix = %ifname%
format-connected-prefix-foreground = ${colors.primary}
label-connected = " %local_ip%"

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true
