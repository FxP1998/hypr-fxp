# == Monitor Settings ==
# Syntax: monitor = name, resolution, position, scale

# --------------------------------------------------------
# 1. LAPTOP SCREEN (PRIORITY)
# --------------------------------------------------------
# High Priority: Always set Laptop to 1080p at 0x0 (Primary)
monitor = eDP-1, 1920x1080@60, 0x0, 1

# --------------------------------------------------------
# 2. VIRTUAL MACHINE (Fallback for VM Testing)
# --------------------------------------------------------
# If eDP-1 is missing (because we are in a VM), this takes over.
# We force 1920x1080 based on your "Virtual-1" capability.
monitor = Virtual-1, 1920x1080@60, 0x0, 1

# --------------------------------------------------------
# 3. EXTERNAL MONITORS
# --------------------------------------------------------
# Placed automatically to the RIGHT of the laptop/main screen.
# "auto" position prevents them from covering the laptop screen.
monitor = HDMI-A-1, preferred, auto, 1
monitor = DP-1, preferred, auto, 1

# --------------------------------------------------------
# 4. UNIVERSAL FALLBACK
# --------------------------------------------------------
# If a monitor name is unknown, use its preferred settings.
monitor = , preferred, auto, 1
