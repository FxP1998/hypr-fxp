# --- CORE COLORS ---
$background = rgb(101418)
$on_background = rgb(e0e2e8)

$surface = rgb(101418)
$on_surface = rgb(e0e2e8)

# --- ACCENT COLORS ---
$primary = rgb(9ccbfb)
$on_primary = rgb(003354)

$secondary = rgb(b9c8da)
$on_secondary = rgb(243240)

$tertiary = rgb(d4bee6)
$on_tertiary = rgb(392a49)

$error = rgb(ffb4ab)
$on_error = rgb(690005)

# --- UI ELEMENTS ---
$outline = rgb(8c9199)
$outline_variant = rgb(42474e)
$shadow = rgb(000000)

# --- CONTAINERS (Useful for "Card" backgrounds) ---
$surface_container = rgb(1c2024)
$surface_container_high = rgb(272a2f)
$surface_container_highest = rgb(323539)

# --- BORDER VARIABLES (Ready to use) ---
# Active: Primary -> Secondary Gradient
$active_border_col = $primary $secondary 45deg

# Inactive: Outline Variant (Subtle Grey)
$inactive_border_col = $outline_variant

# Error/Critical Window Border
$urgent_border_col = $error
