# --- CORE COLORS ---
$background = rgb(131318)
$on_background = rgb(e4e1e9)

$surface = rgb(131318)
$on_surface = rgb(e4e1e9)

# --- ACCENT COLORS ---
$primary = rgb(c0c1ff)
$on_primary = rgb(282a60)

$secondary = rgb(c5c4dd)
$on_secondary = rgb(2e2f42)

$tertiary = rgb(e8b9d4)
$on_tertiary = rgb(46263b)

$error = rgb(ffb4ab)
$on_error = rgb(690005)

# --- UI ELEMENTS ---
$outline = rgb(918f9a)
$outline_variant = rgb(46464f)
$shadow = rgb(000000)

# --- CONTAINERS (Useful for "Card" backgrounds) ---
$surface_container = rgb(1f1f25)
$surface_container_high = rgb(2a292f)
$surface_container_highest = rgb(35343a)

# --- BORDER VARIABLES (Ready to use) ---
# Active: Primary -> Secondary Gradient
$active_border_col = $primary $secondary 45deg

# Inactive: Outline Variant (Subtle Grey)
$inactive_border_col = $outline_variant

# Error/Critical Window Border
$urgent_border_col = $error
