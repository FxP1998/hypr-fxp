# --- CORE COLORS ---
$background = rgb(0f1416)
$on_background = rgb(dee3e6)

$surface = rgb(0f1416)
$on_surface = rgb(dee3e6)

# --- ACCENT COLORS ---
$primary = rgb(88d1eb)
$on_primary = rgb(003543)

$secondary = rgb(b3cad4)
$on_secondary = rgb(1e333b)

$tertiary = rgb(c3c3eb)
$on_tertiary = rgb(2c2e4d)

$error = rgb(ffb4ab)
$on_error = rgb(690005)

# --- UI ELEMENTS ---
$outline = rgb(8a9296)
$outline_variant = rgb(40484c)
$shadow = rgb(000000)

# --- CONTAINERS (Useful for "Card" backgrounds) ---
$surface_container = rgb(1b2023)
$surface_container_high = rgb(252b2d)
$surface_container_highest = rgb(303638)

# --- BORDER VARIABLES (Ready to use) ---
# Active: Primary -> Secondary Gradient
$active_border_col = $primary $secondary 45deg

# Inactive: Outline Variant (Subtle Grey)
$inactive_border_col = $outline_variant

# Error/Critical Window Border
$urgent_border_col = $error
