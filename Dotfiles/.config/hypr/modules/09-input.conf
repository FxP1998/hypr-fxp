# -----------------------------------------------------------------------------
#  HYPRLAND CONFIGURATION (09-input.conf)
#  Created By: M. H. IMAM
#  GitHub: https://github.com/FxP1998/
# -----------------------------------------------------------------------------

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    numlock_by_default = true
    follow_mouse = 1
    sensitivity = 0 

    touchpad {
        natural_scroll = true
    }
}

# == Gestures ==
# See https://wiki.hypr.land/Configuring/Gestures
#gesture = 3, horizontal, workspace
#gesture = 2, pinchin, fullscreen
#gesture = 3, up, mod: super, float

# == Device Specifics ==
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
