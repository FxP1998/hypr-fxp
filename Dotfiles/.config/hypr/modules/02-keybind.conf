# == Variables ==
$mainMod = SUPER

$term = kitty
$files = nautilus
$launcher = ~/.config/hypr/scripts/rofi/rofi-launcher.sh           # rofi -show drun <-- (or we can use this)
$editor = code
$browser = firefox
$filealt = kitty yazi

# == Windows & System ==
bind = $mainMod, q, killactive
bind = ctrl alt, delete, exit,
bind = $mainMod, v, togglefloating,
bind = $mainMod, p, pin
bind = $mainMod, f, fullscreen, 1       # Keep gaps
bind = $mainMod shift, f, fullscreen, 0 # No gaps

# == Application Launchers ==
bind = $mainMod, space, exec, $term
bind = $mainMod, a, exec, $launcher
bind = $mainMod, e, exec, $files
bind = $mainMod, c, exec, $editor
bind = $mainMod, b, exec, $browser
bind = $mainMod shift, e, exec, $filealt
bind = $mainMod shift, space, exec, kitty -T "fxp-tmp"
bind = $mainMod shift, m, exec, kitty -T "kew" kew

# == Layout (Dwindle) ==
bind = $mainMod, k, pseudo,
bind = $mainMod, j, togglesplit,

# == Session Management ==
bind = alt shift, l, exec, hyprlock
bind = $mainMod alt, l, exec, wlogout -b2 --protocol layer-shell

# == Clipboard & Tools ==
bind = $mainMod shift, p, exec, cliphist list | rofi -dmenu -display-columns 2 | cliphist decode | wl-copy
# bind = $mainMod shift, o, hyprexpo:expo, toggle

# == Scripts ==
bind = $mainMod shift, w, exec, ~/.config/hypr/scripts/swww/rofi-wallpaper-changer/wallpaper-selector.sh
bind = $mainMod shift, r, exec, ~/.config/hypr/scripts/waybar/reload.sh

# == Screenshots & Recording ==
bind = $mainMod shift, print, exec, ~/.config/hypr/scripts/screenshot/screenshot.sh area
bind = $mainMod ctrl, print, exec, ~/.config/hypr/scripts/screenshot/screenshot.sh
bind = $mainMod ctrl shift, print, exec, ~/.config/hypr/scripts/screenrecorder/screenrecorder.sh area
bind = $mainMod shift, t, exec, ~/.config/hypr/scripts/screenrecorder/screenrecorder.sh

# == Media Controls (SwayOSD) ==
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# == Media Player ==
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
