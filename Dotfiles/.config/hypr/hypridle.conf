general {
    # Lock command (uses your new hyprlock)
    lock_cmd = pidof hyprlock || hyprlock

    # Unlock command (notify when unlocked)
    unlock_cmd = notify-send "Welcome Back!" "System unlocked"

    # Run before suspend (ensure screen is locked before sleep)
    before_sleep_cmd = loginctl lock-session

    # Run after wake up (turn screen on)
    after_sleep_cmd = hyprctl dispatch dpms on

    # IGNORE INHIBITORS:
    # Set to 'false' so that apps like Firefox/Youtube CAN block locking.
    # If this is true, it will lock even if you are watching a movie.
    ignore_dbus_inhibit = false 
    
    # Audio detectors (if supported by your system audio server)
    ignore_systemd_inhibit = false
}

# -----------------------------------------------------------------------------
# 1. DIM SCREEN (2.5 Minutes)
# -----------------------------------------------------------------------------
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10         # Dim screen to 10%
    on-resume = brightnessctl -r                 # Restore brightness
}

# -----------------------------------------------------------------------------
# 2. LOCK SCREEN (5 Minutes)
# -----------------------------------------------------------------------------
listener {
    timeout = 300
    on-timeout = loginctl lock-session           # Lock the screen
}

# -----------------------------------------------------------------------------
# 3. SCREEN OFF (5.5 Minutes) - "Disconnect Devices"
# -----------------------------------------------------------------------------
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off       # Turn off monitor
    on-resume = hyprctl dispatch dpms on         # Turn on monitor
}

# -----------------------------------------------------------------------------
# 4. SUSPEND (15 Minutes)
# -----------------------------------------------------------------------------
listener {
    timeout = 900
    on-timeout = systemctl suspend               # Sleep to save battery
}
